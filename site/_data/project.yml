# The only repo-specific texts of the website. Everything else comes from the
# repository: the English intro from README.md, the commands from the built CLI.

# How the API is accessed: open | key (env: VAR) | account (token, user, password: VARs)
access:
  type: open

de:
  # German version of the README's intro paragraph. Keep it in step with README.md.
  intro: >-
    Die amtlichen **Wetterwarnungen, Stationsvorhersagen und Meldungen aus der Bevölkerung**
    für Deutschland direkt im Terminal abfragen. `dwd` ist ein kleines Kommandozeilen-Tool für
    die offene [API der DWD-Warnwetter-App](https://dwd.api.bund.dev/) des Deutschen
    Wetterdienstes – kein Konto, kein API-Schlüssel, nur Daten.
